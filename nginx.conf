# NGINX Reverse Proxy Configuration for PickPic
# Place this file in your NGINX sites-enabled directory
# or include it from the main nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/pickpic.access.log;
    error_log   /var/log/nginx/pickpic.error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Upload size (for image uploads)
    client_max_body_size 10M;

    upstream nextjs {
        server 127.0.0.1:3000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name pickpic.com www.pickpic.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name pickpic.com www.pickpic.com;

        # SSL certificates (update paths for your environment)
        ssl_certificate      /etc/nginx/ssl/pickpic.crt;
        ssl_certificate_key  /etc/nginx/ssl/pickpic.key;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Next.js application
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js static files (immutable, long cache)
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache_valid 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public static assets
        location /public/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=86400";
        }
    }
}
